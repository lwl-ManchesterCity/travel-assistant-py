# 追问（ask）链路的评测题库。
#
# 跑法：.venv/bin/python evals/run.py        （**必须从仓库根跑**，配置按 cwd 找 .env）
# 判分逻辑在 evals/judge.py，每个断言键是什么意思看那个文件的模块注释。
#
# ---- 出题的规矩 ----
#
# 1. **期望优先看结构化字段，别读那句答案的措辞。**
#    能写「意图: need_change」就别写「答里要有: 改好了」。
#    能写「记了: false」就别写「答里不许有: 记住」。
#    理由见 judge.py 开头——探针判据 5 连踩三回，就是栽在猜模型的说法上。
#
# 2. **不得不读答案时，写成否命题。**
#    「答里不许有: ['[0-9]{1,2}:[0-9]{2}']」比「答里要有: ['查不到']」稳得多。
#
# 3. **别写只有一种说法的期望。**
#    「第几天」的答案可能是「第二天」「第 2 天」「10 月 1 日」——都算对，所以不判措辞，判它有没有去读方案。
#
# 4. **每题都写「说明」，讲清这题是来照什么的。**
#    没写说明的题，半年后没人敢删。
#
# ---- 方案底本 ----
#
# 所有题共用 tests/test_ask_agent.py 里那份合成方案（`_trip_plan()`）：
#   杭州，2026-09-30 ~ 10-01，两天
#     第一天：杭州西湖风景名胜区（免费）、午餐楼外楼、住西湖湖畔酒店
#     第二天：西溪国家湿地公园（80）、灵隐寺（45）、住西湖湖畔酒店
#   请求参数：预算 3000、偏好「自然风景」、公共交通、舒适型酒店
#
# 所以**别出**「第三天…」这种题——底本只有两天。要问别的城市就在题上写「城市:」，
# 那会同时改方案的 city 和请求的 city（第二跳按它取城市）。
#
# ---- 和现有两个探针的关系 ----
#
# scripts/preference_probe.py 守长期记忆的落库与注入，scripts/opening_hours_probe.py
# 守开放时间的两层链路。这里**故意留了几条重叠**（你好 / 广州塔旋转餐厅），因为探针是
# 改完就归档的一次性验收，而这几条是每次动提示词都该重跑的常驻回归。

# ====================== 一、只要答 · 方案内部的事 ======================

- 问: 这份方案一共几天
  类别: 只要答·方案内
  意图: answer
  该调其一: [get_plan_overview]
  说明: 方案里几天是「方案内部的事」，规则 1a 要求这类数字**必须来自本轮工具返回值**——
        不许凭请求体里那份 tripPlan 直接答，得真去读一次。

- 问: 这份方案一共花了多少钱
  类别: 只要答·方案内
  意图: answer
  该调其一: [get_plan_overview]
  说明: 同上，钱数也是「必须来自工具」的那一档。

- 问: 第二天都去哪些地方
  类别: 只要答·方案内
  意图: answer
  该调其一: [get_day_plan]
  说明: 要的是具体某一天的完整安排 → 该走 get_day_plan 而不是只拿总览。

- 问: 灵隐寺安排在第几天
  类别: 只要答·方案内
  意图: answer
  该调其一: [get_day_plan, get_attraction_detail]
  说明: 不判答案措辞——「第二天」「第 2 天」「10 月 1 日」都对。判的是它有没有去读方案。

- 问: 这两晚住的是哪家酒店
  类别: 只要答·方案内
  意图: answer
  该调其一: [get_plan_overview, get_day_plan]

- 问: 为什么第二天排了两个景点
  类别: 只要答·方案内
  意图: answer
  说明: 问「为什么这么排」——这是想法不是数字，规则 1a 不逼它查工具，所以**这条故意不判工具**。
        留着是为了防「把问原因也判成要改」。

# ====================== 二、只要答 · 客观会变的事实 ======================

- 问: 灵隐寺门票多少钱
  类别: 只要答·客观会变
  意图: answer
  该调其一: [search_attractions_by_tag]
  说明: 票价是「换一年再问会变」的那档 → 必须查本地库，不许凭常识答。

- 问: 西溪湿地几点关门
  类别: 只要答·客观会变
  意图: answer
  该调其一: [search_attractions_by_tag]

- 问: 灵隐寺周一闭馆吗
  类别: 只要答·客观会变
  意图: answer
  该调其一: [search_attractions_by_tag]

- 问: 灵隐寺需要提前预约吗
  类别: 只要答·客观会变
  意图: answer
  该调其一: [search_attractions_by_tag]
  说明: 「要不要预约」也在规则 11c 的「会变」那一串里，跟票价同类。

- 问: 陈家祠门票多少钱
  类别: 只要答·客观会变
  城市: 广州
  意图: answer
  该调其一: [search_attractions_by_tag]
  说明: 问的是**别的城市**、而且方案里压根没有的景点。规则 8 明说「方案里查不到」
        不是拒绝理由，照样判要查。顺带照规则 11c 的第二跳：库里给不出就再联网一次。

- 问: 那它门票多少钱
  类别: 只要答·客观会变
  历史:
    - role: user
      content: 灵隐寺安排在第几天
    - role: assistant
      content: 灵隐寺安排在第二天下午。
  意图: answer
  该调其一: [search_attractions_by_tag]
  说明: 多轮指代——「它」指上一轮的灵隐寺。照的是模型别把指代理解丢了。
        **这条第一次跑（2026-10-16）就红了，而且是真红，不是题写错了**：
        裸问「灵隐寺门票多少钱」（上面第 7 题）它规规矩矩查了库、答 30；
        换成「那它门票多少钱」，它改去读方案、答了方案里那个**估算值 45**。
        规则 11(c) 早就写了「门票…景点在不在方案里都一样，只能查库」，
        **但那句埋在 (c) 里**，而 (c) 开头写的是「或**方案里没有的**景点」——
        景点**在**方案里的时候，模型读到的是 (a)，压根没翻到 (c) 那句。
        修法就是把例外挪进 (a)：见 `ask_agent.py` 规则 11a 与 `get_attraction_detail`
        的工具说明，`test_the_ticket_price_carve_out_lives_inside_branch_a` 钉着它们。
        **留着这条题**：它是那次修复的回归——再有人把 (a) 里那句话删掉，这里会重新变红。

# ====================== 三、只要答 · 不会变的常识 ======================

- 问: 灵隐寺有什么看点
  类别: 只要答·不会变
  意图: answer
  不该调: [search_attractions_by_tag, search_attractions]
  说明: 规则 11c 的「不会变」分路——换一年再问答案也不变，直接答、**不查库**。
        这条是探针完全没盖到的空白区：模型很容易一见「景点问题」就条件反射去查库。

- 问: 广州塔有多高
  类别: 只要答·不会变
  城市: 广州
  意图: answer
  不该调: [search_attractions_by_tag, search_attractions]
  说明: 专门照规则 11c 那句判据——「会不会变」**不是**「是不是数字」。
        广州塔多高是个数字，但它不会变，所以归自答。模型很容易被「数字必须查库」带偏。

- 问: 灵隐寺是哪年建的
  类别: 只要答·不会变
  意图: answer
  不该调: [search_attractions_by_tag, search_attractions]

- 问: 西湖为什么这么有名
  类别: 只要答·不会变
  意图: answer
  不该调: [search_attractions_by_tag, search_attractions]

- 问: 西溪湿地适合带小孩去吗
  类别: 只要答·不会变
  意图: answer
  记了: false
  不该调: [search_attractions_by_tag, search_attractions]
  说明: 规则 11c 的例子里就有「适合小孩吗」，归不会变那档。
        规则 1b 还要求它声明这是「一般经验」——那句话不好机器判，这条只判「没去查库」。
        另加一条「不许记」：**问「适不适合带小孩」不等于「我有小孩」**——用户只是
        问了一句，没说自己任何事。第一次跑时第 34 题的答案里凭空冒出「带小孩」，
        最可能就是从这题漏记进去的。当时这条题没此断言，漏了也照过。

# ====================== 四、只要答 · 闲聊 ======================

- 问: 你好
  类别: 只要答·闲聊
  意图: answer
  记了: false
  不该调任何工具: true
  说明: 三件事一起照：别判成要改、别顺手记一条长期偏好、别为一句问候去调工具。
        和 preference_probe 的那条重叠是故意的。

- 问: 谢谢你的建议
  类别: 只要答·闲聊
  意图: answer
  记了: false
  不该调任何工具: true

- 问: 你这回答得也太慢了吧
  类别: 只要答·闲聊
  意图: answer
  记了: false
  不该调任何工具: true
  说明: 带情绪的一句。照的是模型别把「太慢」读成「改行程节奏」——
        它说的慢是回答慢，不是行程排得满。

# ====================== 五、要改 ======================

- 问: 预算改成 5000 吧
  类别: 要改
  意图: need_change
  说明: 规则 6 列的七种改动诉求里最标准的一条。

- 问: 第二天想轻松点，别排那么满
  类别: 要改
  意图: need_change
  说明: 节奏松紧 → 要改。注意和下面「这一趟想轻松点」是一对：**同一层意思，
        带「第二天」是要改，带「这一趟」是另一回事**。

- 问: 我想换成自驾
  类别: 要改
  意图: need_change

- 问: 住宿改成经济型的吧
  类别: 要改
  意图: need_change

- 问: 帮我加一条偏好，喜欢安静
  类别: 要改
  意图: need_change
  说明: 偏好增删 → 要改。这条同时是「别顺手记成长期偏好」的对照，
        见下面「改成 5000 预算」那条。

- 问: 住到西湖附近吧
  类别: 要改
  意图: need_change
  有锚点: true
  说明: 指定住宿位置——规则 7 要求走 anchorHint + anchorDay，**光有 intent 不够**。
        探针没盖过锚点（它守的是「数」那条线，不是「改」那条）。

# ====================== 六、要改 · 但做不到 ======================

- 问: 帮我把行程改成 5 天
  类别: 要改·做不到
  意图: answer
  答里有否定: true
  说明: 规则 7 明说「改天数做不到」。**关键是别判成 need_change**——判错了会白烧
        40~70 秒重规划，最后还是改不出来。用否定语素判「它说了改不了」，
        别去猜它用的是「改不了」还是「暂不支持」。

- 问: 帮我订一下西湖湖畔酒店
  类别: 要改·做不到
  意图: answer
  答里有否定: true
  说明: 指定某家具体酒店 = 做不到（规则 7）。何况「帮我订」根本不是本系统的能力。

- 问: 把灵隐寺从行程里删掉
  类别: 要改·做不到
  意图: answer
  答里有否定: true
  说明: 删景点 = 做不到（规则 7）。它和「某天必去某景点」（pinHints，做得到）
        是一对反例，别混。

# ====================== 七、长期记忆 · 该记 ======================

- 问: 我不能吃辣
  类别: 记忆·该记
  记了: true
  说明: 用户本人的长期偏好。和 preference_probe 重叠是故意的。

- 问: 我朋友对海鲜过敏
  类别: 记忆·该记
  记了: true
  说明: 同行人的也算长期偏好，但要带 subject（规则 13）。subject 填得对不对
        在 preference_probe 里查过库了，这条只判「记了没有」。

- 问: 我老婆不能吃辣
  类别: 记忆·该记
  记了: true

- 问: 我腰不好，坐久了难受
  类别: 记忆·该记
  记了: true
  说明: 没有「辣 / 过敏」这类关键词，但确实是用户本人的长期状况——
        照的是那条规则别被写窄成「只认忌口」。

# ====================== 八、长期记忆 · 不该记 ======================

- 问: 这一趟想轻松点
  类别: 记忆·不该记
  记了: false
  说明: 「这一趟」的想法不进长期记忆（规则 13）。**故意不判意图**——它未必不是
        要改（节奏松紧也算改动诉求），两者不矛盾。这条只管「别记成长期偏好」。

- 问: 我想去看升旗
  类别: 记忆·不该记
  记了: false
  说明: 没地点的事不进 episodes（规则 13）。

- 问: 今天走了两万步，累死了
  类别: 记忆·不该记
  记了: false
  说明: 闲聊 + 这一趟的事，两个理由都指向不记。

- 问: 改成 5000 预算
  类别: 记忆·不该记
  意图: need_change
  记了: false
  说明: 照一个很容易混的点——**「改预算」不该被顺手记成一条长期偏好**。
        它是一次改动诉求，不是「这个人是谁」。模型在这里很容易多记一条。

# ====================== 九、兜底 ======================

- 问: 广州塔旋转餐厅几点关门
  类别: 兜底
  城市: 广州
  意图: answer
  答里有否定: true
  说明: 高德只会返回「最接近的广州塔」。正确答案是**如实说查不到**，不许拿广州塔的
        营业时间顶替。和 opening_hours_probe 判据 5 重叠是故意的——它是这次改动里
        最容易出错的一条，值得留成常驻回归。

- 问: 北京故宫几点关门
  类别: 兜底
  城市: 北京
  意图: answer
  该调其一: [search_attractions_by_tag, search_attractions]
  说明: 北京在本地库收录的四城里（杭州 / 北京 / 上海 / 广州）。照的是
        「别因为方案里没有这个景点就拒绝查」。

- 问: 拉萨天空之镜观景台几点关门
  类别: 兜底
  城市: 拉萨
  意图: answer
  答里有否定: true
  说明: 拉萨**不在**本地库收录的四城里，而「天空之镜观景台」是个编的名字。
        两层都拿不到，只能如实说没有。（中间那跳「指路去联网」在探针判据 9 里守。）
        这条**第一次跑要盯一眼**：万一高德硬凑一个「最接近的」出来，模型能不能守住。
